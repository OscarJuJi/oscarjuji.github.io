    <script>
      (function () {
        // Dark by default; a stored choice wins. Must agree with useDarkMode
        // in hooks.js — if the two disagree the page paints one theme and then
        // swaps, which is the exact flash this script exists to prevent.
        var saved = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', saved || 'dark');
      })();
    </script>
